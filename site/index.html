<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive by Aaron Formilleza 2026</title>
    <meta
      name="description"
      content="The portfolio archive of multidisciplinary animation director Aaron Formilleza."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      href="fonts/AlteHaasGroteskBold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="style.css?v=20261017-clean3" />
  </head>
  <body>
    <div class="archive-canvas">
      <p
        class="viewer-time archive-clock"
        id="viewer-time"
        aria-label="Viewer local time"
      ></p>
      <div class="site-shell" id="site-shell" aria-hidden="true">
        <aside class="left-panel">
          <div class="artist-bio">
            <p class="bio-description">
              Aaron Formilleza アーロンフォーミレザ<br />
              (b. 1994, Riyadh) is a Tokyo-based multidisciplinary animation
              director working across all forms of digital media.
            </p>

            <p class="bio-contact">
              NEW PROJECTS &amp; INQUIRIES<br />
              <a href="mailto:ormillef@gmail.com">ormillef@gmail.com</a><br />
              <a
                href="https://www.instagram.com/aaronformilleza/"
                target="_blank"
                rel="noopener noreferrer"
                >Instagram,</a
              >
              <a
                href="https://x.com/OrmilleF"
                target="_blank"
                rel="noopener noreferrer"
                >Twitter</a
              >
            </p>
          </div>

          <div class="index-wrap">
            <span
              class="index-indicator"
              id="index-indicator"
              aria-hidden="true"
            ></span>
            <nav
              class="index-nav"
              id="index-nav"
              aria-label="Project archive"
            ></nav>
          </div>
        </aside>

        <main class="project-column" id="project-column">
          <div
            id="active-project"
            class="active-project"
            aria-live="polite"
          ></div>
        </main>
      </div>

      <footer class="site-footer">
        <p>2026 © Aaron Formilleza<br />All rights reserved.</p>
      </footer>
    </div>
    <div class="brand" id="home-link" aria-label="Aaron Formilleza">
      <button class="intro-window" type="button" aria-label="Enter archive"
        ><img
          id="intro-preview"
          src="intro-images/001.webp"
          alt=""
          width="640"
          height="360"
      /></button>
      <div class="brand-name">
        <button
          class="brand-line"
          data-name-line
          type="button"
          aria-label="Aaron — enter archive"
          ><span class="name-original"
            ><span class="name-text">AARON</span></span
          ></button
        >
        <button
          class="brand-line"
          data-name-line
          type="button"
          aria-label="Formilleza — enter archive"
          ><span class="name-original"
            ><span class="name-text">FORMILLEZA</span></span
          ></button
        >
      </div>
      <div class="brand-japanese" lang="ja"
        ><span>フ</span><span>ォ</span><span>ー</span><span>ミ</span
        ><span>レ</span><span>ザ</span><span>ア</span><span>ー</span
        ><span>ロ</span><span>ン</span></div
      >
    </div>
    <div class="intro" id="intro" aria-label="Introduction"></div>
    <div class="intro-copy" id="intro-copy">
      <p class="intro-discipline"><span>Art, Direction</span></p>
      <p class="intro-year"
        ><span><em>2026</em></span></p
      >
    </div>

    <script src="projects.js?v=20261017-clean3"></script>
    <script src="script.js?v=20261017-clean3"></script>
  </body>
</html>
